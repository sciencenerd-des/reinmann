name: CI

# Builds the whole Lean development and re-proves the headline claim on every push:
# 0 `sorry`, 0 custom axioms — the RH *reduction* chain depends only on Lean's
# three foundational axioms.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          bash elan-init.sh -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Lean / lake versions
        run: |
          lean --version
          lake --version

      - name: Cache mathlib build artifacts
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
          restore-keys: |
            lake-${{ runner.os }}-

      - name: Fetch cached mathlib
        run: lake exe cache get || true

      - name: Build
        run: lake build

      - name: Verify axiom-clean (0 sorry, 0 custom axioms)
        run: bash scripts/verify_axiom_clean.sh

  xi-rectangle-certificate:
    # Numerical tables are intentionally outside the default library target.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          bash elan-init.sh -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Reserve disk for numerical proof objects
        # Only preinstalled SDKs on this disposable runner; Lean needs none of them.
        run: |
          df -h .
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .

      - name: Cache Lean dependencies
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: rectangle-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
          restore-keys: |
            rectangle-${{ runner.os }}-
            lake-${{ runner.os }}-

      - name: Fetch cached mathlib
        run: lake exe cache get || true

      - name: Build the closed rectangle certificate
        # Keep peak memory bounded on hosted runners. Local builds may use more jobs.
        run: python3 experiments/prime_spectral/build_xi_rectangle.py --jobs 1 --output tmp/xi-rectangle-ci

      - name: Audit rectangle theorem dependencies and source
        run: python3 experiments/prime_spectral/verify_xi_rectangle.py --live-audit

      - name: Retain certificate build receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xi-rectangle-receipts
          path: tmp/xi-rectangle-ci
