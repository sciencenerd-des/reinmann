name: CI

# Builds the whole Lean development and re-proves the headline claim on every push:
# 0 `sorry`, 0 custom axioms — the RH *reduction* chain depends only on Lean's
# three foundational axioms.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          bash elan-init.sh -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Lean / lake versions
        run: |
          lean --version
          lake --version

      - name: Cache mathlib build artifacts
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
          restore-keys: |
            lake-${{ runner.os }}-

      - name: Fetch cached mathlib
        run: lake exe cache get || true

      - name: Build
        run: lake build

      - name: Verify axiom-clean (0 sorry, 0 custom axioms)
        run: bash scripts/verify_axiom_clean.sh
